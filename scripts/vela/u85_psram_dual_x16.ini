; Initial PSRAM approximation for U85 Z1024: two SRAM AXIs and two EXT AXIs.
; Memory assumption: two independent x16, 400 MHz DDR channels (3.2 GB/s peak).
; Model 75% sustained data-phase efficiency: 2.4 GB/s total, read/write shared.
; The additional 100 ns response latency and two outstanding reads/writes per
; AXI are engineering assumptions, not measurements of a particular PSRAM.
; SRAM retains the existing reference timing in NPU cycles; its capacity is
; selected separately with --arena-cache-size and matching firmware allocation.
; Pair with ta_config_u85_psram_dual_x16.cmake at the same target NPU frequency.

[System_Config.Ethos_U85_PSRAM_Dual_X16_800]
core_clock=800e6
axi0_port=Sram
axi1_port=Dram
Sram_clock_scale=1.0
Sram_ports_used=2
Sram_burst_length=64
Sram_read_latency=32
Sram_write_latency=32
Sram_max_reads=8
Sram_max_writes=8
Dram_clock_scale=0.09375
Dram_ports_used=2
Dram_burst_length=128
Dram_read_latency=80
Dram_write_latency=80
Dram_max_reads=2
Dram_max_writes=2

[System_Config.Ethos_U85_PSRAM_Dual_X16_400]
core_clock=400e6
axi0_port=Sram
axi1_port=Dram
Sram_clock_scale=1.0
Sram_ports_used=2
Sram_burst_length=64
Sram_read_latency=32
Sram_write_latency=32
Sram_max_reads=8
Sram_max_writes=8
Dram_clock_scale=0.1875
Dram_ports_used=2
Dram_burst_length=128
Dram_read_latency=40
Dram_write_latency=40
Dram_max_reads=2
Dram_max_writes=2

; Match the existing firmware region configuration. Dram is Vela's writable
; external-memory category; retaining this name does not imply a DDR device.
[Memory_Mode.Dedicated_Sram]
const_mem_area=Axi1
arena_mem_area=Axi1
cache_mem_area=Axi0
arena_cache_size=393216
